<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Simon Says</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Игра Simon</h1>
    
    <!-- Экран для вывода счета и сообщений -->
    <div id="status">Нажмите «Старт»</div>

    <!-- Игровое поле 2x2 -->
    <div class="game-board">
        <div class="sector" id="btn-0"></div>
        <div class="sector" id="btn-1"></div>
        <div class="sector" id="btn-2"></div>
        <div class="sector" id="btn-3"></div>
    </div>

    <button id="start-btn">Старт</button>

    <script src="script.js"></script>
</body>
</html>
