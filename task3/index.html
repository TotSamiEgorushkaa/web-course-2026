<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лабораторная работа: ToDo List</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="todo-app">
    <h1>Список задач</h1>

    <div class="input-group">
      <input type="text" id="task-input" placeholder="Что нужно сделать?" autofocus>
      <button id="add-btn" type="button">Добавить</button>
    </div>

    <div class="controls">
      <div class="filters">
        <button class="filter-btn active" data-filter="all">Все</button>
        <button class="filter-btn" data-filter="active">Активные</button>
        <button class="filter-btn" data-filter="completed">Завершённые</button>
      </div>
      <div class="stats" id="stats-counter">
        Осталось: 0, Выполнено: 0
      </div>
    </div>

    <ul id="task-list" class="task-list"></ul>
  </main>
</body>
</html>
