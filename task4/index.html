<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторная №4: Быки и Коровы</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Быки и Коровы</h1>
        <p class="rules">Компьютер загадал 4-значное число с неповторяющимися цифрами.<br>Попробуйте угадать его!</p>
        
        <div class="controls">
            <input type="text" id="guessInput" placeholder="Введите 4 цифры" maxlength="4" autocomplete="off">
            <button id="checkBtn">Проверить</button>
            <button id="newGameBtn" class="secondary">Новая игра</button>
        </div>

        <div id="message" class="message"></div>

        <div class="stats">
            <span>Попыток: <strong id="attemptsCount">0</strong></span>
        </div>

        <h2>История попыток</h2>
        <ul id="historyList" class="history"></ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
